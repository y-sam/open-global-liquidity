US:
  liquidity:
    us_central_bank_total_assets:
      classification: measured_data
      provider: bis
      series_id: BIS,WS_CBTA,1.0/M.US.B.XDC.USD.N
      component: us_central_bank_total_assets
      title: "United States - Central bank, assets, total, BIS-spliced"
      description: >-
        Monthly BIS-spliced US central-bank total assets in domestic currency. This harmonized
        series is used only in Global Model G; WALCL remains the direct Federal Reserve source for
        the higher-frequency US models.
      unit: "Billions of U.S. Dollars"
      frequency: "Monthly, End of Period"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2002-01-31"
      source: "Bank for International Settlements, Central bank total assets"
      source_url: "https://data.bis.org/topics/CBTA/BIS,WS_CBTA,1.0/M.US.B.XDC.USD.N"

    fed_assets:
      classification: measured_data
      provider: fred
      series_id: WALCL
      component: fed_assets
      title: "Assets: Total Assets: Total Assets (Less Eliminations from Consolidation): Wednesday Level"
      description: >-
        Total assets of the Federal Reserve Banks, less eliminations from consolidation.
        This is measured source data and is not itself the OGLI or a Howell/CrossBorder model.
      unit: "Millions of U.S. Dollars"
      frequency: "Weekly, As of Wednesday"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2002-12-18"
      source: "Board of Governors of the Federal Reserve System (US), H.4.1"
      source_url: "https://fred.stlouisfed.org/series/WALCL"

    treasury_general_account:
      classification: measured_data
      provider: fred
      series_id: WDTGAL
      component: treasury_general_account
      title: "U.S. Treasury General Account: Wednesday Level"
      description: >-
        U.S. Treasury General Account deposits at Federal Reserve Banks at Wednesday level.
        This measured cash balance is not itself a liquidity model or an OGLI component weight.
      unit: "Millions of U.S. Dollars"
      frequency: "Weekly, As of Wednesday"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2002-12-18"
      source: "Board of Governors of the Federal Reserve System (US), H.4.1"
      source_url: "https://fred.stlouisfed.org/series/WDTGAL"

    overnight_reverse_repo:
      classification: measured_data
      provider: fred
      series_id: RRPONTSYD
      component: overnight_reverse_repo
      title: "Overnight Reverse Repurchase Agreements: Treasury Securities Sold by the Federal Reserve"
      description: >-
        Aggregate daily amount of overnight reverse-repurchase transactions reported by the
        Federal Reserve Bank of New York. This source series is daily and is not silently
        interpolated or converted to a weekly economic model in this milestone.
      unit: "Billions of U.S. Dollars"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2014-01-01"
      source: "Federal Reserve Bank of New York, Temporary Open Market Operations"
      source_url: "https://fred.stlouisfed.org/series/RRPONTSYD"

    reserve_balances:
      classification: measured_data
      provider: fred
      series_id: WRBWFRBL
      component: reserve_balances
      title: "Reserve Balances with Federal Reserve Banks: Wednesday Level"
      description: >-
        Reserve balances held with Federal Reserve Banks at Wednesday level. The Wednesday-level
        series is selected for consistency with the balance-sheet stock observations; it is not
        the weekly-average WRESBAL series.
      unit: "Millions of U.S. Dollars"
      frequency: "Weekly, As of Wednesday"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2002-12-18"
      source: "Board of Governors of the Federal Reserve System (US), H.4.1"
      source_url: "https://fred.stlouisfed.org/series/WRBWFRBL"

  markets:
    bitcoin:
      classification: measured_data
      provider: coinmetrics
      series_id: btc.PriceUSD
      component: bitcoin
      title: "Coin Metrics Bitcoin Price (USD)"
      description: >-
        Daily Bitcoin price in U.S. dollars from Coin Metrics Community Data. This measured,
        non-commercial community dataset is separate from OGLI and is used only as a retrospective
        market outcome under the CC BY-NC 4.0 licence.
      unit: "U.S. Dollars per Bitcoin"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2010-07-18"
      source: "Coin Metrics Community Data"
      source_url: "https://community-api.coinmetrics.io/v4/"

  point_in_time_markets:
    gold:
      classification: measured_data
      provider: world_bank
      series_id: CMO-GOLD-MONTHLY
      component: gold
      title: "World Bank Gold Price, Monthly Average"
      description: >-
        Monthly average gold price in nominal U.S. dollars per troy ounce from the World Bank
        Commodity Price Data (Pink Sheet). It is an outcome series, not an OGLI input; its monthly
        average is not a daily spot or month-end fixing.
      unit: "U.S. Dollars per Troy Ounce"
      frequency: "Monthly Average"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "1960-01-31"
      source: "World Bank Prospects Group, Commodity Price Data (The Pink Sheet)"
      source_url: "https://thedocs.worldbank.org/en/doc/18675f1d1639c7a34d463f59263ba0a2-0050012025/worldbank-commodities-price-data-the-pink-sheet"

  context:
    treasury_yield_10y:
      classification: measured_data
      provider: fred
      series_id: DGS10
      component: treasury_yield_10y
      title: "Market Yield on U.S. Treasury Securities at 10-Year Constant Maturity"
      description: >-
        Daily 10-year constant-maturity Treasury yield. It is displayed as macro context and is
        not an input to OGLI or a liquidity-model term.
      unit: "Percent"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2006-01-02"
      source: "Board of Governors of the Federal Reserve System (US), H.15"
      source_url: "https://fred.stlouisfed.org/series/DGS10"

    treasury_yield_2y:
      classification: measured_data
      provider: fred
      series_id: DGS2
      component: treasury_yield_2y
      title: "Market Yield on U.S. Treasury Securities at 2-Year Constant Maturity"
      description: >-
        Daily 2-year constant-maturity Treasury yield. It is displayed as macro context and is
        not an input to OGLI or a liquidity-model term.
      unit: "Percent"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2006-01-02"
      source: "Board of Governors of the Federal Reserve System (US), H.15"
      source_url: "https://fred.stlouisfed.org/series/DGS2"

    broad_usd_index:
      classification: measured_data
      provider: fred
      series_id: DTWEXBGS
      component: broad_usd_index
      title: "Nominal Broad U.S. Dollar Index"
      description: >-
        Daily nominal broad trade-weighted U.S. dollar index. It is displayed as macro context and
        is not an input to OGLI or a liquidity-model term.
      unit: "Index Jan 2006=100"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2006-01-02"
      source: "Board of Governors of the Federal Reserve System (US), H.10"
      source_url: "https://fred.stlouisfed.org/series/DTWEXBGS"

  collateral:
    marketable_treasury_debt_public:
      classification: measured_data
      provider: treasury
      series_id: MSPD.TABLE1.TOTAL_MARKETABLE.DEBT_HELD_PUBLIC
      component: marketable_treasury_debt_public
      title: "Total Marketable Treasury Securities Held by the Public"
      description: >-
        Monthly par-value stock from the Treasury Monthly Statement of the Public Debt, Total
        Marketable row. Debt held by the public includes Federal Reserve Banks, so the model
        subtracts separately measured Fed Treasury holdings as an explicit approximation of
        collateral circulating outside the central bank. It does not measure collateral reuse.
      unit: "Millions of U.S. Dollars"
      frequency: "Monthly, End of Period"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2001-01-31"
      source: "U.S. Treasury Fiscal Data, Monthly Statement of the Public Debt"
      source_url: "https://fiscaldata.treasury.gov/datasets/monthly-statement-public-debt/"

    fed_treasury_holdings:
      classification: measured_data
      provider: fred
      series_id: TREAST
      component: fed_treasury_holdings
      title: "Assets: Securities Held Outright: U.S. Treasury Securities: All: Wednesday Level"
      description: >-
        Federal Reserve Treasury securities held outright. The collateral pilot subtracts this
        stock from gross marketable debt as a transparent approximation of securities removed
        from private circulation. Fed securities lending means the approximation is imperfect.
      unit: "Millions of U.S. Dollars"
      frequency: "Weekly, As of Wednesday"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2002-12-18"
      source: "Board of Governors of the Federal Reserve System (US), H.4.1"
      source_url: "https://fred.stlouisfed.org/series/TREAST"

    secured_overnight_financing_rate:
      classification: measured_data
      provider: fred
      series_id: SOFR
      component: secured_overnight_financing_rate
      title: "Secured Overnight Financing Rate"
      description: >-
        Broad transaction-based measure of the overnight cost of financing Treasury securities.
        The model uses its spread to the effective federal funds rate as an imperfect secured
        funding-pressure proxy, not as a direct repo haircut measure.
      unit: "Percent"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2018-04-03"
      source: "Federal Reserve Bank of New York, Secured Overnight Financing Rate Data"
      source_url: "https://fred.stlouisfed.org/series/SOFR"

    effective_federal_funds_rate:
      classification: measured_data
      provider: fred
      series_id: DFF
      component: effective_federal_funds_rate
      title: "Federal Funds Effective Rate"
      description: >-
        Effective rate on overnight unsecured federal funds transactions. It is used only as the
        comparison leg of the SOFR funding-spread proxy.
      unit: "Percent"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2018-04-03"
      source: "Federal Reserve Bank of New York"
      source_url: "https://fred.stlouisfed.org/series/DFF"

    treasury_yield_10y_collateral:
      classification: measured_data
      provider: fred
      series_id: DGS10
      component: treasury_yield_10y_collateral
      title: "Market Yield on U.S. Treasury Securities at 10-Year Constant Maturity"
      description: >-
        Daily 10-year constant-maturity yield reused to calculate a transparent realized-rate-
        volatility proxy. This is not the proprietary MOVE Index and is not a direct haircut.
      unit: "Percent"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2018-04-03"
      source: "Board of Governors of the Federal Reserve System (US), H.15"
      source_url: "https://fred.stlouisfed.org/series/DGS10"

FX:
  exchange_rates:
    usd_per_euro:
      classification: measured_data
      provider: fred
      series_id: DEXUSEU
      component: usd_per_euro
      title: "U.S. Dollars to Euro Spot Exchange Rate"
      description: >-
        Daily noon buying rate in U.S. dollars per euro. Used only to translate euro-denominated
        central-bank assets into the v0.3 USD aggregate; no interpolation is applied.
      unit: "U.S. Dollars to One Euro"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "1999-01-04"
      source: "Board of Governors of the Federal Reserve System (US), H.10"
      source_url: "https://fred.stlouisfed.org/series/DEXUSEU"
    yen_per_usd:
      classification: measured_data
      provider: fred
      series_id: DEXJPUS
      component: yen_per_usd
      title: "Japanese Yen to U.S. Dollar Spot Exchange Rate"
      description: >-
        Daily noon buying rate in yen per U.S. dollar. It is inverted arithmetically when
        translating yen-denominated central-bank assets into U.S. dollars.
      unit: "Japanese Yen to One U.S. Dollar"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "1971-01-04"
      source: "Board of Governors of the Federal Reserve System (US), H.10"
      source_url: "https://fred.stlouisfed.org/series/DEXJPUS"
    usd_per_sterling:
      classification: measured_data
      provider: fred
      series_id: DEXUSUK
      component: usd_per_sterling
      title: "U.S. Dollars to U.K. Pound Sterling Spot Exchange Rate"
      description: >-
        Daily noon buying rate in U.S. dollars per pound sterling. Used only for transparent
        currency translation in the v0.3 aggregate.
      unit: "U.S. Dollars to One U.K. Pound Sterling"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "1971-01-04"
      source: "Board of Governors of the Federal Reserve System (US), H.10"
      source_url: "https://fred.stlouisfed.org/series/DEXUSUK"
    yuan_per_usd:
      classification: measured_data
      provider: fred
      series_id: DEXCHUS
      component: yuan_per_usd
      title: "Chinese Yuan Renminbi to U.S. Dollar Spot Exchange Rate"
      description: >-
        Daily noon buying rate in renminbi per U.S. dollar. It is inverted arithmetically when
        translating China central-bank assets into U.S. dollars.
      unit: "Chinese Yuan Renminbi to One U.S. Dollar"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "1981-01-02"
      source: "Board of Governors of the Federal Reserve System (US), H.10"
      source_url: "https://fred.stlouisfed.org/series/DEXCHUS"

EA:
  liquidity:
    euro_area_central_bank_total_assets:
      classification: measured_data
      provider: bis
      series_id: BIS,WS_CBTA,1.0/M.XM.B.XDC.EUR.N
      component: euro_area_central_bank_total_assets
      title: "Euro area - Central bank, assets, total, BIS-spliced"
      description: >-
        Monthly BIS-spliced euro-area central-bank total assets in domestic currency, used only in
        the harmonized Global Model G panel. The direct ECB series remains a validation source.
      unit: "Billions of Euro"
      frequency: "Monthly, End of Period"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2002-01-31"
      source: "Bank for International Settlements, Central bank total assets"
      source_url: "https://data.bis.org/topics/CBTA/BIS,WS_CBTA,1.0/M.XM.B.XDC.EUR.N"

    eurosystem_total_assets:
      classification: measured_data
      provider: ecb
      series_id: BSI.M.U2.N.C.T00.A.1.Z5.0000.Z01.E
      component: eurosystem_total_assets
      title: "Total assets of the Eurosystem, Stocks"
      description: >-
        Monthly period-end total assets of the Eurosystem for the euro area of changing
        composition. This is a measured-data expansion pilot: it is not converted to U.S.
        dollars, combined with US data, or used in OGLI.
      unit: "Millions of Euro"
      frequency: "Monthly, End of Period"
      seasonal_adjustment: "Neither seasonally nor working day adjusted"
      start: "1997-09-30"
      source: "European Central Bank, ECB Data Portal, Balance Sheet Items"
      source_url: "https://data.ecb.europa.eu/data/concepts/statistical-balance-sheet"

JP:
  liquidity:
    japan_central_bank_total_assets:
      classification: measured_data
      provider: bis
      series_id: BIS,WS_CBTA,1.0/M.JP.B.XDC.JPY.N
      component: japan_central_bank_total_assets
      title: "Japan - Central bank, assets, total, BIS-spliced"
      description: >-
        Monthly BIS-spliced Japanese central-bank total assets in domestic currency, used only in
        the harmonized Global Model G panel. The direct BOJ series remains a validation source.
      unit: "Billions of Japanese Yen"
      frequency: "Monthly, End of Period"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2002-01-31"
      source: "Bank for International Settlements, Central bank total assets"
      source_url: "https://data.bis.org/topics/CBTA/BIS,WS_CBTA,1.0/M.JP.B.XDC.JPY.N"

    boj_total_assets:
      classification: measured_data
      provider: boj
      series_id: BS01.MABJMTA
      component: boj_total_assets
      title: "Bank of Japan Accounts: Assets: Total"
      description: >-
        Monthly total assets reported in the Bank of Japan Accounts. This is a separate
        measured-data pilot in native yen: it is not converted to U.S. dollars, combined with
        US or euro-area data, or used in OGLI.
      unit: "100 Million Yen"
      frequency: "Monthly, End of Period"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "1998-04-30"
      source: "Bank of Japan, BOJ Time-Series Data Search, Bank of Japan Accounts"
      source_url: "https://www.boj.or.jp/en/statistics/boj/other/ac/index.htm"

GB:
  liquidity:
    uk_central_bank_total_assets:
      classification: measured_data
      provider: bis
      series_id: BIS,WS_CBTA,1.0/M.GB.B.XDC.GBP.N
      component: uk_central_bank_total_assets
      title: "United Kingdom - Central bank, assets, total, BIS-spliced"
      description: >-
        Monthly BIS-spliced UK central-bank total assets in domestic currency, used only in the
        harmonized Global Model G panel. The lagged direct BoE series remains a validation source.
      unit: "Billions of Sterling"
      frequency: "Monthly, End of Period"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2002-01-31"
      source: "Bank for International Settlements, Central bank total assets"
      source_url: "https://data.bis.org/topics/CBTA/BIS,WS_CBTA,1.0/M.GB.B.XDC.GBP.N"

    boe_total_assets:
      classification: measured_data
      provider: boe
      series_id: RPQB75A
      component: boe_total_assets
      title: "Central Bank Assets: Total"
      description: >-
        Quarterly total assets/liabilities of the UK central bank reported in the Bank of England
        consolidated balance sheet. The complete balance sheet is published with a five-quarter
        lag. This is a
        separate measured-data pilot in native sterling: it is not converted to U.S. dollars,
        combined with US, euro-area, or Japan data, or used in OGLI.
      unit: "Millions of Sterling"
      frequency: "Quarterly"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2013-09-30"
      source: "Bank of England, Statistical Interactive Database, consolidated balance sheet"
      source_url: "https://www.bankofengland.co.uk/boeapps/database/"

CN:
  liquidity:
    china_central_bank_total_assets:
      classification: measured_data
      provider: bis
      series_id: BIS,WS_CBTA,1.0/M.CN.B.XDC.CNY.N
      component: china_central_bank_total_assets
      title: "China - Central bank, assets, total, BIS-spliced"
      description: >-
        Monthly China central-bank total assets from the BIS central-bank-total-assets dataset.
        From January 2002 the BIS compilation uses the monthly PBoC balance sheet. The BIS-spliced
        label identifies a compilation methodology and the series must not be presented as a
        verbatim PBoC table. BIS statistics have explicit permitted-use terms subject to source
        citation and non-misleading presentation, so this is the public China series.
      unit: "Billions of Chinese Yuan"
      frequency: "Monthly, End of Period"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2002-01-31"
      source: "Bank for International Settlements, Central bank total assets"
      source_url: "https://data.bis.org/topics/CBTA/BIS,WS_CBTA,1.0/M.CN.B.XDC.CNY.N"

    pboc_total_assets:
      classification: measured_data
      provider: pboc
      series_id: PBOC.BSMA.TOTAL_ASSETS
      component: pboc_total_assets
      title: "Balance Sheet of Monetary Authority: Total Assets"
      description: >-
        Monthly total assets from the People's Bank of China's official Balance Sheet of
        Monetary Authority. PBOC.BSMA.TOTAL_ASSETS is a project identifier for the verified table
        row, not an official PBoC series code. It is retained as a local/private validation source
        and is not redistributed in the hosted dashboard or public data snapshots.
      unit: "100 Million Yuan"
      frequency: "Monthly, End of Period"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2013-01-31"
      source: "People's Bank of China, Money and Banking Statistics"
      source_url: "https://www.pbc.gov.cn/diaochatongjisi/116219/116319/index.html"
