US:
  liquidity:
    fed_assets:
      classification: measured_data
      provider: fred
      series_id: WALCL
      component: fed_assets
      title: "Assets: Total Assets: Total Assets (Less Eliminations from Consolidation): Wednesday Level"
      description: >-
        Total assets of the Federal Reserve Banks, less eliminations from consolidation.
        This is measured source data and is not itself the OGLI or a Howell/CrossBorder model.
      unit: "Millions of U.S. Dollars"
      frequency: "Weekly, As of Wednesday"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2002-12-18"
      source: "Board of Governors of the Federal Reserve System (US), H.4.1"
      source_url: "https://fred.stlouisfed.org/series/WALCL"

    treasury_general_account:
      classification: measured_data
      provider: fred
      series_id: WDTGAL
      component: treasury_general_account
      title: "U.S. Treasury General Account: Wednesday Level"
      description: >-
        U.S. Treasury General Account deposits at Federal Reserve Banks at Wednesday level.
        This measured cash balance is not itself a liquidity model or an OGLI component weight.
      unit: "Millions of U.S. Dollars"
      frequency: "Weekly, As of Wednesday"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2002-12-18"
      source: "Board of Governors of the Federal Reserve System (US), H.4.1"
      source_url: "https://fred.stlouisfed.org/series/WDTGAL"

    overnight_reverse_repo:
      classification: measured_data
      provider: fred
      series_id: RRPONTSYD
      component: overnight_reverse_repo
      title: "Overnight Reverse Repurchase Agreements: Treasury Securities Sold by the Federal Reserve"
      description: >-
        Aggregate daily amount of overnight reverse-repurchase transactions reported by the
        Federal Reserve Bank of New York. This source series is daily and is not silently
        interpolated or converted to a weekly economic model in this milestone.
      unit: "Billions of U.S. Dollars"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2014-01-01"
      source: "Federal Reserve Bank of New York, Temporary Open Market Operations"
      source_url: "https://fred.stlouisfed.org/series/RRPONTSYD"

    reserve_balances:
      classification: measured_data
      provider: fred
      series_id: WRBWFRBL
      component: reserve_balances
      title: "Reserve Balances with Federal Reserve Banks: Wednesday Level"
      description: >-
        Reserve balances held with Federal Reserve Banks at Wednesday level. The Wednesday-level
        series is selected for consistency with the balance-sheet stock observations; it is not
        the weekly-average WRESBAL series.
      unit: "Millions of U.S. Dollars"
      frequency: "Weekly, As of Wednesday"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2002-12-18"
      source: "Board of Governors of the Federal Reserve System (US), H.4.1"
      source_url: "https://fred.stlouisfed.org/series/WRBWFRBL"

  markets:
    bitcoin:
      classification: measured_data
      provider: coinmetrics
      series_id: btc.PriceUSD
      component: bitcoin
      title: "Coin Metrics Bitcoin Price (USD)"
      description: >-
        Daily Bitcoin price in U.S. dollars from Coin Metrics Community Data. This measured,
        non-commercial community dataset is separate from OGLI and is used only as a retrospective
        market outcome under the CC BY-NC 4.0 licence.
      unit: "U.S. Dollars per Bitcoin"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2010-07-18"
      source: "Coin Metrics Community Data"
      source_url: "https://community-api.coinmetrics.io/v4/"

  context:
    treasury_yield_10y:
      classification: measured_data
      provider: fred
      series_id: DGS10
      component: treasury_yield_10y
      title: "Market Yield on U.S. Treasury Securities at 10-Year Constant Maturity"
      description: >-
        Daily 10-year constant-maturity Treasury yield. It is displayed as macro context and is
        not an input to OGLI or a liquidity-model term.
      unit: "Percent"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2006-01-02"
      source: "Board of Governors of the Federal Reserve System (US), H.15"
      source_url: "https://fred.stlouisfed.org/series/DGS10"

    treasury_yield_2y:
      classification: measured_data
      provider: fred
      series_id: DGS2
      component: treasury_yield_2y
      title: "Market Yield on U.S. Treasury Securities at 2-Year Constant Maturity"
      description: >-
        Daily 2-year constant-maturity Treasury yield. It is displayed as macro context and is
        not an input to OGLI or a liquidity-model term.
      unit: "Percent"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2006-01-02"
      source: "Board of Governors of the Federal Reserve System (US), H.15"
      source_url: "https://fred.stlouisfed.org/series/DGS2"

    broad_usd_index:
      classification: measured_data
      provider: fred
      series_id: DTWEXBGS
      component: broad_usd_index
      title: "Nominal Broad U.S. Dollar Index"
      description: >-
        Daily nominal broad trade-weighted U.S. dollar index. It is displayed as macro context and
        is not an input to OGLI or a liquidity-model term.
      unit: "Index Jan 2006=100"
      frequency: "Daily"
      seasonal_adjustment: "Not Seasonally Adjusted"
      start: "2006-01-02"
      source: "Board of Governors of the Federal Reserve System (US), H.10"
      source_url: "https://fred.stlouisfed.org/series/DTWEXBGS"
