weekly_alignment:
  classification: model_assumption
  canonical_frequency: "W-WED"
  observation_day: "Wednesday"
  output_unit: "Millions of U.S. Dollars"
  daily_asof_components:
    - overnight_reverse_repo
  daily_asof_max_staleness_days: 7
  weekly_missing_policy: "exact_only"

liquidity_models:
  model_a:
    name: "Model A — Fed assets"
    classification: model_assumption
    formula: "fed_assets"
    description: >-
      Federal Reserve total assets, used as the simplest central-bank balance-sheet liquidity
      measure. It does not adjust for liability-side drains or describe all system liquidity.
    terms:
      fed_assets: 1.0

  model_b:
    name: "Model B — Net Fed liquidity proxy"
    classification: model_assumption
    formula: "fed_assets - treasury_general_account - overnight_reverse_repo"
    description: >-
      A common public-market proxy that adjusts Fed assets for the Treasury General Account and
      overnight reverse-repo absorption. This is an Open Global Liquidity research assumption and
      is not Michael Howell or CrossBorder Capital's proprietary formula.
    terms:
      fed_assets: 1.0
      treasury_general_account: -1.0
      overnight_reverse_repo: -1.0

  model_c:
    name: "Model C — Reserve-based liquidity"
    classification: model_assumption
    formula: "reserve_balances"
    description: >-
      Reserve balances held at Federal Reserve Banks are used as a direct settlement-liquidity
      proxy. TGA and reverse repo are not subtracted again because their effects are already
      reflected in reserve balances and doing so could double count drains.
    terms:
      reserve_balances: 1.0

ogli:
  classification: statistical_transformation
  description: >-
    Experimental Open Global Liquidity Index normalization. OGLI measures how statistically
    unusual current liquidity momentum is relative to its historical distribution. It is an
    independent Open Global Liquidity methodology, not CrossBorder Capital's proprietary GLI.
  normalization:
    classification: statistical_transformation
    default_mode: expanding
    min_periods: 104
  momentum_weights:
    classification: model_assumption
    growth_3m_annualized: 0.60
    growth_12m_yoy: 0.40
  regimes:
    classification: model_assumption
    thresholds:
      - {label: "Strong contraction", max: 10}
      - {label: "Contraction", max: 30}
      - {label: "Below normal", max: 45}
      - {label: "Neutral", max: 55}
      - {label: "Above normal", max: 70}
      - {label: "Expansion", max: 90}
      - {label: "Strong expansion", max: 100}

market_alignment:
  classification: model_assumption
  canonical_frequency: "W-WED"
  observation_day: "Wednesday"
  daily_asof_components:
    - bitcoin
    - treasury_yield_10y
    - treasury_yield_2y
    - broad_usd_index
  daily_asof_max_staleness_days: 7
  missing_policy: "latest_prior_close"

market_analysis:
  classification: statistical_transformation
  liquidity_signal: momentum_score
  publication_lag_policy: "observation_and_available_information"
  signal_availability_lag_weeks: 1
  forward_horizons_weeks: [0, 4, 8, 12, 26, 52]
  correlation_min_periods: 52
  non_overlapping_min_periods: 8
  confidence_level: 0.95
  bootstrap:
    classification: statistical_transformation
    method: circular_moving_block_percentile
    resamples: 1000
    block_length_observations: 8
    seed: 42
  research_subperiods:
    classification: model_assumption
    periods:
      - id: pre_2020
        label: "Pre-2020"
        start: "2010-07-18"
        end: "2019-12-31"
      - id: pandemic_cycle
        label: "2020-2022"
        start: "2020-01-01"
        end: "2022-12-31"
      - id: recent_cycle
        label: "2023-present"
        start: "2023-01-01"
        end: null
  rolling_window_weeks: 52
  rolling_min_periods: 26
  description: >-
    Horizon zero compares the liquidity signal with the contemporaneous one-week market return.
    Positive horizons compare the signal at t with the market return from t through t+h. The
    pipeline retains the observation-date view and adds a one-week available-information view,
    reflecting that Wednesday H.4.1 observations are normally published after that Wednesday's
    market close. Both remain descriptive associations and do not establish causation or calibrate
    OGLI parameters. The configured date partitions are descriptive research assumptions selected
    before examining their results; they are not optimized breakpoints. Correlation uncertainty is
    also estimated with a deterministic circular moving-block bootstrap. Its resample count,
    eight-observation block length, and random seed are transparent statistical assumptions rather
    than calibrated parameters. For non-overlapping outcome samples, eight retained observations
    can span substantially more than eight calendar weeks.

point_in_time_pilot:
  classification: model_assumption
  frequency: month_end
  start: "2021-01-31"
  current_comparison_policy: same_observation_date
  market_analysis:
    classification: model_assumption
    publication_lag_weeks: [0, 1, 2, 4]
    forward_horizons_months: [1, 3, 6, 12]
    correlation_min_periods: 12
    non_overlapping_correlation_min_periods: 8
    bitcoin_directional_regimes:
      classification: model_assumption
      expansionary: ["Above normal", "Expansion", "Strong expansion"]
      contractionary: ["Below normal", "Contraction", "Strong contraction"]
      excluded: ["Neutral"]
      description: >-
        Directional contrast groups point-in-time OGLI regimes above neutral as expansionary and
        regimes below neutral as contractionary. Neutral observations are excluded from the
        contrast. The grouping is declared before calculation and is not optimized against Bitcoin
        outcomes.
    primary_bitcoin_specification:
      classification: model_assumption
      model_id: model_b
      publication_lag_weeks: 1
      sample_policy: non_overlapping
      forward_horizons_months: [1, 3, 6, 12]
      description: >-
        Predeclared primary display specification for Bitcoin research. Model B, a one-week
        assumed information-availability delay, and non-overlapping outcome windows are emphasized
        for interpretability and reduced dependence. Alternative models, delays, and overlapping
        samples remain visible as robustness checks. This choice is an Open Global Liquidity model
        assumption and is not calibrated to maximize Bitcoin returns or correlations.

calibrated_parameters: {}
