[project]
name = "open-global-liquidity"
version = "0.1.0"
description = "Transparent public-data research infrastructure for the Open Global Liquidity Index."
readme = "README.md"
authors = [
    { name = "Yuri Sampaio", email = "ysmp@proton.me" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "pandas>=2.2,<4",
    "plotly>=6,<7",
    "pyarrow>=17,<24",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "scipy>=1.14,<2",
    "streamlit>=1.49,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-httpx>=0.35,<1",
    "ruff>=0.12,<1",
]

[project.scripts]
ogli-pipeline = "open_global_liquidity.pipeline:main"
ogli-vintage = "open_global_liquidity.vintage_pipeline:main"
ogli-point-in-time = "open_global_liquidity.point_in_time_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
